services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: lostlink
      POSTGRES_USER: lostlink
      POSTGRES_PASSWORD: lostlink-dev
    ports:
      - "5432:5432"
    volumes:
      - lostlink-postgres:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostlink -d lostlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://lostlink:lostlink-dev@postgres:5432/lostlink
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  admin-web:
    build:
      context: ./admin-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  lostlink-postgres:
